<!DOCTYPE html>
<html>
<head>
    <title>BookShop API Gateway</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 60px auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            margin-bottom: 32px;
        }

        a {
            display: block;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
        }

            a:hover {
                background: #e8e8e8;
            }
    </style>
</head>
<body>
    <h1>BookShop API Gateway</h1>
    <p>All services routed through port 5000.</p>
    <a href="/catalog/swagger">Catalog API</a>
    <a href="/ordering/swagger">Ordering API</a>
    <a href="/basket/swagger">Basket API</a>
    <a href="/payments/swagger">Payments API</a>

</html>
