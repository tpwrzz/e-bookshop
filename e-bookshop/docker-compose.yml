services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10
      start_period: 20s
  catalog-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - catalog-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd",
             "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  ordering-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"          # Different HOST port — same container port 1433
    volumes:
      - ordering-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd",
             "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  catalog-api:
    build:
      context: .                          # repo root — SharedKernel is visible
      dockerfile: Catalog/Catalog.API/Dockerfile
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CatalogDb: >
        Server=catalog-db;Database=e-bookshop-catalog;
        User Id=sa;Password=YourStrong!Passw0rd;
        TrustServerCertificate=True;
    depends_on:
      catalog-db:
        condition: service_healthy

  ordering-api:
    build:
      context: .
      dockerfile: Ordering/Ordering.API/Dockerfile
    ports:
      - "5263:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__OrdersDb: >
        Server=ordering-db;Database=e-bookshop-orders;
        User Id=sa;Password=YourStrong!Passw0rd;
        TrustServerCertificate=True;
    depends_on:
      ordering-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  couchbase:
    image: couchbase:community-7.6.1
    ports:
      - "8091:8091"
      - "8093:8093"
      - "11210:11210"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/pools"]
      interval: 10s
      retries: 15
      start_period: 60s

  couchbase-init:
    image: couchbase:community-7.6.1
    depends_on:
      couchbase:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c", "sleep 15 && couchbase-cli cluster-init -c couchbase://couchbase --cluster-username Administrator --cluster-password password --cluster-ramsize 512 --services data,index,query && couchbase-cli bucket-create -c couchbase://couchbase --username Administrator --password password --bucket basket --bucket-type couchbase --bucket-ramsize 128"]
  
  basket-api:
    build:
      context: .
      dockerfile: Basket/Basket.API/Dockerfile
    ports:
      - "5189:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Couchbase: couchbase://couchbase
      Couchbase__Username: Administrator
      Couchbase__Password: password
      Couchbase__BucketName: basket
      RabbitMQ__Host: rabbitmq
    depends_on:
      couchbase:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    volumes:
      - payments-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd",
             "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  payments-api:
    build:
      context: .
      dockerfile: Payments/Payments.API/Dockerfile
    ports:
      - "5246:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDb: "Server=payments-db;Database=e-bookshop-payments;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      RabbitMQ__Host: rabbitmq
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Gateway/Bookshop.Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address: http://catalog-api:8080
      ReverseProxy__Clusters__ordering-cluster__Destinations__ordering-api__Address: http://ordering-api:8080
      ReverseProxy__Clusters__basket-cluster__Destinations__basket-api__Address: http://basket-api:8080
      ReverseProxy__Clusters__payments-cluster__Destinations__payments-api__Address: http://payments-api:8080
    depends_on:
      - catalog-api
      - ordering-api
      - basket-api
      - payments-api
volumes:
  catalog-db-data:
  ordering-db-data:
  payments-db-data:
  rabbitmq-data:
  couchbase-data:  